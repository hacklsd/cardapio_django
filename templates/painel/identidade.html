{% extends "painel/base.html" %}
{% block title %}{{ titulo }}{% endblock %}
{% block content %}
<section class="panel-card panel-edit-form">
    <h1>{{ titulo }}</h1>
    <p>O nome e a logo aparecem no cabeçalho de todas as páginas públicas.</p>
    <form method="post" class="panel-form" enctype="multipart/form-data">
        {% csrf_token %}
        {% if form.instance.restaurant_logo %}
            <img
                class="brand-upload-preview"
                src="{{ form.instance.restaurant_logo.url }}"
                alt="Logo atual do restaurante"
            >
        {% endif %}
        {{ form.as_p }}
        <div class="panel-actions">
            <button type="submit">Salvar identidade</button>
            <a href="{% url 'painel:dashboard' %}">Voltar ao painel</a>
        </div>
    </form>
</section>
{% endblock %}
